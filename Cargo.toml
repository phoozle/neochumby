[workspace]
resolver = "3"
members = [
    "crates/neochumby",
    "crates/neochumby-macros",
    "crates/neochumby-manifest",
    "crates/neochumby-ncurses",
    "crates/neochumby-proto",
    "crates/neochumby-softfloat",
    "crates/neochumby-sync",
    "crates/neochumby-sys",
    "crates/neochumbyd",
    "apps/airplay",
    "apps/bonsai",
    "apps/aquarium",
    "apps/home",
    "apps/logs",
    "apps/classic",
    "apps/doom",
    "apps/fetch",
    "apps/genact",
    "apps/htop",
    "apps/cmatrix",
    "apps/clock",
    "apps/pipes",
    "apps/quake",
    "apps/top",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
libc = "0.2"
neochumby = { path = "crates/neochumby" }
neochumby-macros = { path = "crates/neochumby-macros" }
neochumby-ncurses = { path = "crates/neochumby-ncurses" }
neochumby-softfloat = { path = "crates/neochumby-softfloat" }
neochumby-proto = { path = "crates/neochumby-proto" }
neochumby-sync = { path = "crates/neochumby-sync" }
neochumby-sys = { path = "crates/neochumby-sys" }
toml = "0.8"

# No unsafe code outside neochumby-sys (and the games, FFI to C engines):
# see neochumby-sys and CONTRIBUTING.md. Deny, not forbid, so that those
# crates can allow it.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 2
lto = true
panic = "abort"
codegen-units = 1
# Symbols and line tables stay: crash addresses and profiles are looked up
# against them. They cost nothing on the device, where binaries are paged in
# over NFS and the debug sections are never read.
strip = false
debug = "line-tables-only"
