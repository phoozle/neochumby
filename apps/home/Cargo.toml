[package]
name = "neochumby-home"
description = "neochumby's app list: the installed apps, pairing, the time, and back to the Chumby"
license = "MIT"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
neochumby.workspace = true
neochumby-proto.workspace = true
neochumby-sys.workspace = true

[package.metadata.neochumby]
exec = "neochumby-home"
start = true
# It pairs the Chumby (writing /psp) and lists every app in the tree.
access = ["root"]

[lints]
workspace = true
