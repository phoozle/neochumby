[package]
name = "neochumby-top"
description = "procps' top on the Chumby Classic, on neochumby's terminal, as a neochumby app"
# top is GPL-2.0-or-later (its library LGPL-2.1-or-later), and this binary
# links it.
license = "GPL-2.0-or-later"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
neochumby.workspace = true
neochumby-ncurses.workspace = true

[build-dependencies]
cc = "1"

[package.metadata.neochumby]
title = "TOP"
exec = "neochumby-top"
# Reads every process from /proc.
access = ["screen", "touch", "system", "terminal"]
colour = "c8a028"

[lints]
workspace = true
