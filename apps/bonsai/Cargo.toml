[package]
name = "neochumby-bonsai"
description = "cbonsai on the Chumby Classic, on neochumby's terminal, as a neochumby app"
# cbonsai is GPL-3.0, and this binary links it.
license = "GPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
neochumby.workspace = true
neochumby-ncurses.workspace = true

[build-dependencies]
cc = "1"

[package.metadata.neochumby]
title = "BONSAI"
exec = "neochumby-bonsai"
access = ["screen", "touch", "terminal"]
colour = "78a03c"

[lints]
workspace = true
