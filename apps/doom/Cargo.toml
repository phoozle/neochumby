[package]
name = "neochumby-doom"
description = "Doom (doomgeneric) on the Chumby Classic, as a neochumby app"
# doomgeneric is GPL-2.0, and this binary links it.
license = "GPL-2.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
libc.workspace = true
neochumby.workspace = true

[build-dependencies]
cc = "1"

[package.metadata.neochumby]
title = "DOOM"
exec = "neochumby-doom"
colour = "dc281e"
# A game: no service may replace it in front, and the top button fires.
interrupt = false
button = true
access = ["screen", "touch", "speaker"]

[lints]
workspace = true
