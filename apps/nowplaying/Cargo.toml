[package]
name = "neochumby-nowplaying"
description = "Now playing for neochumby: what the airplay app plays (title, artist, album, cover art, progress), with play/pause, next and previous"
license = "MIT"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Three binaries, and a library of what needs no Chumby, tested on the host:
#   neochumby-nowplaying            the screen, in front when opened (exec=)
#   neochumby-nowplaying-service    the Chumby's: AirPlay's metadata from
#                                   the airplay app's service, through the
#                                   companion and back (service=)
#   neochumby-nowplaying-companion  neochumbyd's: parses the metadata,
#                                   scales the cover, and sends the
#                                   buttons to the sender (companion=)
[lib]
path = "src/lib.rs"

[[bin]]
name = "neochumby-nowplaying"
path = "src/screen.rs"

[[bin]]
name = "neochumby-nowplaying-service"
path = "src/main.rs"

[[bin]]
name = "neochumby-nowplaying-companion"
path = "src/companion/main.rs"

[dependencies]
neochumby-proto.workspace = true
neochumby-sys.workspace = true
embedded-graphics = "0.8"
# The companion's: shairport-sync's metadata is base64.
base64 = "0.22"

# Only the Chumby's binaries use the device library.
[target.'cfg(target_arch = "arm")'.dependencies]
neochumby.workspace = true

# Only the companion, on neochumbyd's host, decodes cover art (tools/tree
# builds it for the Chumby too, with the app's other binaries, where it
# never runs and goes without).
[target.'cfg(not(target_arch = "arm"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[package.metadata.neochumby]
title = "NOW PLAYING"
exec = "neochumby-nowplaying"
colour = "8c64dc"
service = "neochumby-nowplaying-service"
companion = "neochumby-nowplaying-companion"
neochumbyd = "required"
# The screen draws and takes touches; the service only uses local sockets
# and its companion.
access = ["screen", "touch"]

[lints]
workspace = true
