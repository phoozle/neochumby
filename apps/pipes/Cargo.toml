[package]
name = "neochumby-pipes"
description = "pipes-rs on the Chumby Classic, on neochumby's terminal, as a neochumby app"
# pipes-rs is GPL-3.0, and this binary is built from it.
license = "GPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
neochumby.workspace = true
# pipes-rs's.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
termwiz = "0.23"

[package.metadata.neochumby]
title = "PIPES"
exec = "neochumby-pipes"
access = ["screen", "touch", "terminal"]
colour = "3caa78"

[lints]
workspace = true
