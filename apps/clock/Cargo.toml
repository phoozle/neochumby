[package]
name = "neochumby-clock"
description = "tty-clock on the Chumby Classic, on neochumby's terminal, as a neochumby app"
# tty-clock is BSD-3-Clause (the notice at the top of ttyclock.c); the app's
# own code is under the workspace's terms.
license = "BSD-3-Clause"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
neochumby.workspace = true
neochumby-ncurses.workspace = true

[build-dependencies]
cc = "1"

[package.metadata.neochumby]
title = "CLOCK"
exec = "neochumby-clock"
access = ["screen", "touch", "terminal"]
colour = "3c8cd0"

[lints]
workspace = true
