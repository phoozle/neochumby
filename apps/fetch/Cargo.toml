[package]
name = "neochumby-fetch"
description = "fastfetch on the Chumby Classic, on neochumby's terminal, as a neochumby app"
# fastfetch is MIT, as we are.
license = "MIT"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
neochumby.workspace = true

[build-dependencies]
cc = "1"
cmake = "0.1"

[package.metadata.neochumby]
title = "FETCH"
exec = "neochumby-fetch"
colour = "3c8cb4"
# fastfetch reads the system: /proc, /sys and /etc.
access = ["screen", "touch", "system", "terminal"]

[lints]
workspace = true
