# Every push and pull request, on GitHub's own runners: formatting, lints
# and tests on the host, and every binary built for both of its targets
# (the Chumby's ARM926 and neochumbyd's x86_64), with TLS and with Noise.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.17.0

jobs:
  host:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      # The workspace has members in submodules (aquarium's asciiquarium-rs),
      # without which cargo can't load it.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Ours, not the third-party crates in submodules that some apps build
      # from (they keep their own formatting).
      - run: cargo fmt --check $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.manifest_path | contains("/third_party/") | not) | "-p " + .name')
      # The crates that build for the host: the protocol, sync's rounds (on
      # both sides, so a temporary directory stands in for the stick),
      # neochumbyd, the manifest tool, the system calls, the macros,
      # AirPlay's companion and library (its frames and the screen's
      # layout), and neochumby-classic's engine (its host build renders
      # frames to files).
      - run: cargo clippy --all-targets -p neochumby-proto -p neochumby-sync -p neochumbyd -p neochumby-manifest -p neochumby-sys -p neochumby-macros -p neochumby-classic -- -D warnings
      - run: cargo clippy -p neochumby-airplay --lib --bin neochumby-airplay-companion -- -D warnings
      # The logs app's text, layout and drawing, and its companion.
      - run: cargo clippy --all-targets -p neochumby-logs -- -D warnings
      - run: cargo test -p neochumby-proto -p neochumby-sync -p neochumbyd -p neochumby-manifest -p neochumby-sys -p neochumby-macros -p neochumby-classic
      - run: cargo test -p neochumby-proto -p neochumby-sync --features neochumby-proto/noise
      - run: cargo test -p neochumby-airplay --lib --bin neochumby-airplay-companion
      - run: cargo test -p neochumby-logs
      # dev/emulate's full-system machine, without firmware: its images
      # against chumby-emu's, and its control path against a stub QEMU.
      - run: python3 dev/test_emulate.py

  cross:
    name: Build for the Chumby and the server (${{ matrix.proto }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        proto: [tls, noise]
    steps:
      # The apps' third-party C is in submodules (cmake, which builds
      # fetch's fastfetch, is on the runner).
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv5te-unknown-linux-musleabi, x86_64-unknown-linux-musl
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Features
        run: |
          if [ "${{ matrix.proto }}" = noise ]; then
            echo "FEATURES=--features neochumby-proto/noise" >> "$GITHUB_ENV"
          fi
      # Every app, not just the default tree's.
      - name: The Chumby's binaries
        run: |
          cargo clippy --release --target armv5te-unknown-linux-musleabi $FEATURES \
            -p neochumby -p neochumby-home -p neochumby-airplay -p neochumby-doom -p neochumby-quake \
            -p neochumby-fetch -p neochumby-htop -p neochumby-top -p neochumby-cmatrix -p neochumby-clock \
            -p neochumby-bonsai -p neochumby-pipes -p neochumby-aquarium -p neochumby-genact -p neochumby-classic -p neochumby-logs -- -D warnings
          cargo build --release --target armv5te-unknown-linux-musleabi $FEATURES \
            -p neochumby -p neochumby-home -p neochumby-airplay -p neochumby-doom -p neochumby-quake \
            -p neochumby-fetch -p neochumby-htop -p neochumby-top -p neochumby-cmatrix -p neochumby-clock \
            -p neochumby-bonsai -p neochumby-pipes -p neochumby-aquarium -p neochumby-genact -p neochumby-classic -p neochumby-logs
      - name: The server's binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl $FEATURES -p neochumbyd
          cargo build --release --target x86_64-unknown-linux-musl $FEATURES \
            -p neochumby-airplay --bin neochumby-airplay-companion
          cargo build --release --target x86_64-unknown-linux-musl $FEATURES \
            -p neochumby-logs --bin neochumby-logs-companion
      - name: A tree, as tools/tree lays it out
        if: matrix.proto == 'tls'
        run: |
          tools/tree "$RUNNER_TEMP/tree" doom quake airplay fetch htop top \
            cmatrix clock bonsai pipes aquarium genact classic logs
          find "$RUNNER_TEMP/tree" -type f | sort
      # The end-to-end scenarios (dev/e2e), on that tree booted as a Chumby
      # would be under qemu-arm (dev/emulate's user mode): the home screen,
      # a tap on DOOM, the devices, the corner hold, CHUMBY MODE, a boot
      # from a stick image; and delivery=sync through a power cut mid-round,
      # paired with this neochumbyd, with the real boot hook; and AirPlay's
      # screen, with dev/fake-shairport for shairport-sync. Those on
      # the stock firmware run only locally, on your own (docs/legal.md).
      - name: End-to-end scenarios under dev/emulate
        if: matrix.proto == 'tls'
        timeout-minutes: 15
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-user-binfmt dosfstools busybox-static
          sudo dev/e2e "$RUNNER_TEMP/tree" target/x86_64-unknown-linux-musl/release/neochumbyd "$RUNNER_TEMP/e2e"
